name: Deploy to Google Play (Internal Testing)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'

      - name: Build APK/AAB
        run: ./gradlew assembleRelease  # o el comando adecuado para tu app

      - name: Upload to Google Play (Internal Testing)
        uses: r0adkll/upload-google-play-action@v1
        with:
          serviceAccountJsonKey: ${{ secrets.GOOGLE_PLAY_JSON }}
          packageName: com.nullpointer.devs.drivers  # nombre del paquete de tu app
          releaseFile: app/build/outputs/bundle/release/app-release.aab  # archivo AAB generado
          track: internal  # para pruebas internas
