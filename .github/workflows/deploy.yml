name: Deploy to Google Play (Internal Testing)

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      -  name: Setup JDK 20
         uses: actions/setup-java@v3
         with:
            distribution: temurin
            java-version: 20

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew
        
      - name: Setup Gradle Cache
        uses: gradle/gradle-build-action@v2
        with:
           gradle-home-cache-cleanup: true

      - name: Bump Version Code
        uses: chkfung/android-version-actions@v1.2.1
        with:
           gradlePath: app/build.gradle.kts
           versionCode: ${{ github.run_number }}
           versionName: 1.0.0
           
      - name: Build APK/AAB
        run: ./gradlew bundleRelease

      - name: Sign AAb
        id: sign
        uses: r0adkll/sign-android-release@v1
        with:
           releaseDirectory: app/build/outputs/bundle/release
           signingKeyBase64: ${{ secrets.KEYSTORE }}
           alias: ${{ secrets.SIGNING_KEY_ALIAS }}
           keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
           keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Upload app bundle as artifact
        uses: actions/upload-artifact@v4
        with:
           name: app-bundle
           path: app/build/outputs/bundle/release/app-release.aab
           
      - run: echo Build status report=${{ job.status }}
  deploy:
    name: Job_2 - Deploy aab to playstore
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download app bundle from artifact
        uses: actions/download-artifact@v2
        with:
          name: app-bundle
      - name: Publish to Play Store
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: '${{ secrets.GOOGLE_PLAY_JSON }}'
          packageName: com.nullpointer.devs.drivers
          releaseFiles: '${{ github.workspace }}/app-release.aab'
          track: internal
